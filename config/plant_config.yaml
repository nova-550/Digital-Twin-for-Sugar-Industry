# ============================================================
# Sugar Mill Digital Twin — Plant Configuration
# Edit this file to tune thresholds, targets, and parameters.
# No code changes required.
# ============================================================

plant:
  name: "SugarTech Digital Mill"
  capacity_tcd: 5000          # Tons of cane per day
  campaign_start: "2024-11-01"
  timezone: "Asia/Kolkata"
  currency: "INR"
  energy_tariff_per_kwh: 6.5  # INR

# ──────────────────────────────────────────────────────────────
# Global KPI Targets (Industry Benchmarks)
# ──────────────────────────────────────────────────────────────
kpi_targets:
  energy_intensity_kwh_per_ton: 38.0    # kWh/ton cane (world-class: 32)
  water_usage_m3_per_ton: 1.2           # m³/ton cane
  sugar_recovery_pct: 11.5              # % recovery
  co2_emissions_tons_per_day: 85.0      # tons CO₂/day
  plant_oee_pct: 88.0                   # Overall Equipment Effectiveness
  downtime_pct: 5.0                     # Max acceptable downtime %
  steam_consumption_kg_per_tc: 450      # kg steam / ton cane
  bagasse_moisture_pct: 50.0            # % moisture in bagasse

# ──────────────────────────────────────────────────────────────
# Process Stage Definitions
# ──────────────────────────────────────────────────────────────
stages:
  - id: cane_handling
    name: "Cane Handling"
    icon: "🌾"
    color: "#4CAF50"
    order: 1

  - id: milling
    name: "Milling"
    icon: "⚙️"
    color: "#2196F3"
    order: 2

  - id: clarification
    name: "Clarification"
    icon: "🧪"
    color: "#9C27B0"
    order: 3

  - id: evaporation
    name: "Evaporation"
    icon: "💨"
    color: "#FF9800"
    order: 4

  - id: crystallization
    name: "Crystallization"
    icon: "💎"
    color: "#00BCD4"
    order: 5

  - id: centrifugation
    name: "Centrifugation"
    icon: "🔄"
    color: "#F44336"
    order: 6

  - id: drying
    name: "Drying & Cooling"
    icon: "🌡️"
    color: "#FFEB3B"
    order: 7

  - id: molasses
    name: "Molasses Handling"
    icon: "🛢️"
    color: "#795548"
    order: 8

# ──────────────────────────────────────────────────────────────
# Stage-Specific Parameters & Thresholds
# ──────────────────────────────────────────────────────────────
cane_handling:
  cane_feed_rate_tph:      { base: 210.0, noise: 5.0, min: 150, max: 250 }
  cane_brix_pct:           { base: 20.5,  noise: 0.8, min: 17, max: 24 }
  cane_pol_pct:            { base: 18.2,  noise: 0.6, min: 15, max: 21 }
  trash_pct:               { base: 3.5,   noise: 0.5, min: 1, max: 8 }
  moisture_pct:            { base: 72.0,  noise: 1.5, min: 68, max: 78 }
  conveyor_speed_mpm:      { base: 45.0,  noise: 2.0, min: 30, max: 60 }
  unloading_rate_trucks_hr: { base: 12.0, noise: 1.0, min: 6, max: 18 }
  alerts:
    cane_feed_rate_tph:   { low: 170, high: 240 }
    trash_pct:            { low: 0, high: 6 }

milling:
  mill_extraction_pct:     { base: 96.5,  noise: 0.5, min: 93, max: 98 }
  juice_brix_pct:          { base: 15.2,  noise: 0.4, min: 13, max: 18 }
  juice_pol_pct:           { base: 13.8,  noise: 0.3, min: 11, max: 16 }
  bagasse_moisture_pct:    { base: 50.5,  noise: 1.0, min: 46, max: 56 }
  imbibition_water_pct:    { base: 25.0,  noise: 1.5, min: 20, max: 32 }
  mill_speed_rpm:          { base: 4.2,   noise: 0.2, min: 3, max: 6 }
  mill_ampere:             { base: 185.0, noise: 10.0, min: 140, max: 230 }
  fiber_pct_in_bagasse:    { base: 46.0,  noise: 1.0, min: 42, max: 50 }
  alerts:
    mill_extraction_pct:  { low: 94, high: 100 }
    bagasse_moisture_pct: { low: 44, high: 54 }
    mill_ampere:          { low: 150, high: 220 }

clarification:
  juice_ph:                { base: 7.2,   noise: 0.15, min: 6.5, max: 8.5 }
  lime_dosage_kg_tc:       { base: 0.85,  noise: 0.05, min: 0.5, max: 1.5 }
  clarified_juice_purity_pct: { base: 84.5, noise: 0.8, min: 80, max: 90 }
  mud_volume_pct:          { base: 12.0,  noise: 1.0, min: 8, max: 18 }
  clarification_temp_c:    { base: 102.0, noise: 1.5, min: 98, max: 108 }
  sulfur_dosage_ppm:       { base: 180.0, noise: 10.0, min: 100, max: 300 }
  turbidity_ntu:           { base: 35.0,  noise: 5.0, min: 15, max: 80 }
  alerts:
    juice_ph:              { low: 6.8, high: 8.0 }
    clarified_juice_purity_pct: { low: 82, high: 100 }
    lime_dosage_kg_tc:     { low: 0.6, high: 1.3 }

evaporation:
  juice_brix_in_pct:       { base: 15.0,  noise: 0.4, min: 12, max: 18 }
  juice_brix_out_pct:      { base: 62.0,  noise: 1.2, min: 58, max: 68 }
  steam_pressure_bar:      { base: 2.8,   noise: 0.15, min: 2.0, max: 4.0 }
  steam_flow_tph:          { base: 45.0,  noise: 2.0, min: 35, max: 58 }
  vapor_temp_1st_c:        { base: 115.0, noise: 2.0, min: 108, max: 125 }
  vapor_temp_2nd_c:        { base: 98.0,  noise: 1.5, min: 92, max: 106 }
  vapor_temp_3rd_c:        { base: 82.0,  noise: 1.5, min: 76, max: 90 }
  vapor_temp_4th_c:        { base: 68.0,  noise: 1.5, min: 62, max: 76 }
  energy_efficiency_pct:   { base: 89.0,  noise: 1.5, min: 82, max: 96 }
  evaporation_rate_tph:    { base: 168.0, noise: 5.0, min: 140, max: 200 }
  alerts:
    vapor_temp_1st_c:      { low: 108, high: 122 }
    juice_brix_out_pct:    { low: 58, high: 67 }
    energy_efficiency_pct: { low: 84, high: 100 }
    steam_pressure_bar:    { low: 2.2, high: 3.8 }

crystallization:
  supersaturation_coeff:   { base: 1.12,  noise: 0.03, min: 1.0, max: 1.3 }
  vacuum_pressure_mbar:    { base: 68.0,  noise: 3.0, min: 50, max: 90 }
  massecuite_brix_pct:     { base: 92.0,  noise: 1.0, min: 88, max: 96 }
  crystal_purity_pct:      { base: 99.2,  noise: 0.2, min: 98, max: 99.8 }
  pan_temp_c:              { base: 68.0,  noise: 2.0, min: 62, max: 76 }
  batch_cycle_min:         { base: 120.0, noise: 8.0, min: 90, max: 150 }
  crystal_size_mm:         { base: 0.85,  noise: 0.05, min: 0.6, max: 1.1 }
  steam_consumption_tph:   { base: 12.0,  noise: 0.8, min: 8, max: 18 }
  alerts:
    supersaturation_coeff: { low: 1.05, high: 1.25 }
    crystal_purity_pct:    { low: 98.5, high: 100 }
    vacuum_pressure_mbar:  { low: 55, high: 85 }

centrifugation:
  centrifuge_speed_rpm:    { base: 1050.0, noise: 30.0, min: 900, max: 1200 }
  massecuite_feed_tph:     { base: 35.0,   noise: 2.0, min: 25, max: 45 }
  sugar_purity_pct:        { base: 99.5,   noise: 0.15, min: 98.5, max: 99.9 }
  molasses_brix_pct:       { base: 88.0,   noise: 1.5, min: 84, max: 94 }
  wash_water_m3_hr:        { base: 0.8,    noise: 0.1, min: 0.4, max: 1.5 }
  motor_ampere:            { base: 125.0,  noise: 8.0, min: 90, max: 160 }
  cycle_time_sec:          { base: 35.0,   noise: 3.0, min: 25, max: 50 }
  alerts:
    sugar_purity_pct:      { low: 99.0, high: 100 }
    centrifuge_speed_rpm:  { low: 950, high: 1180 }
    motor_ampere:          { low: 95, high: 155 }

drying:
  inlet_sugar_moisture_pct:  { base: 1.8,  noise: 0.15, min: 1.0, max: 3.0 }
  outlet_sugar_moisture_pct: { base: 0.05, noise: 0.01, min: 0.01, max: 0.15 }
  inlet_air_temp_c:          { base: 105.0, noise: 3.0, min: 90, max: 120 }
  outlet_air_temp_c:         { base: 45.0,  noise: 2.0, min: 35, max: 55 }
  sugar_temp_outlet_c:       { base: 38.0,  noise: 2.0, min: 30, max: 50 }
  drum_speed_rpm:            { base: 6.0,   noise: 0.3, min: 4, max: 9 }
  air_flow_m3_hr:            { base: 8500.0, noise: 200, min: 6000, max: 11000 }
  dust_emission_mg_m3:       { base: 28.0,  noise: 5.0, min: 10, max: 60 }
  alerts:
    outlet_sugar_moisture_pct: { low: 0, high: 0.12 }
    inlet_air_temp_c:          { low: 92, high: 118 }
    dust_emission_mg_m3:       { low: 0, high: 50 }

molasses:
  molasses_brix_pct:       { base: 88.5,  noise: 1.0, min: 84, max: 93 }
  molasses_purity_pct:     { base: 32.0,  noise: 1.5, min: 26, max: 40 }
  tank_level_pct:          { base: 65.0,  noise: 2.0, min: 10, max: 95 }
  pump_flow_m3_hr:         { base: 8.5,   noise: 0.5, min: 4, max: 15 }
  storage_temp_c:          { base: 42.0,  noise: 2.0, min: 35, max: 55 }
  viscosity_cp:            { base: 8500,  noise: 300, min: 5000, max: 15000 }
  dispatch_rate_m3_hr:     { base: 4.5,   noise: 0.5, min: 0, max: 12 }
  alerts:
    tank_level_pct:        { low: 15, high: 90 }
    storage_temp_c:        { low: 38, high: 52 }
    molasses_purity_pct:   { low: 28, high: 40 }

# ──────────────────────────────────────────────────────────────
# Anomaly Injection (for demo realism)
# ──────────────────────────────────────────────────────────────
anomaly_settings:
  enabled: true
  probability_per_minute: 0.02   # 2% chance per minute to inject anomaly
  duration_minutes: { min: 3, max: 15 }

# ──────────────────────────────────────────────────────────────
# Sustainability Emission Factors
# ──────────────────────────────────────────────────────────────
emission_factors:
  electricity_kg_co2_per_kwh: 0.716   # India grid factor
  bagasse_kg_co2_per_kg: 0.0          # Bagasse = carbon neutral
  diesel_kg_co2_per_liter: 2.68

# ──────────────────────────────────────────────────────────────
# Data Retention
# ──────────────────────────────────────────────────────────────
data_retention:
  live_buffer_seconds: 3600          # 1 hour in-memory
  sqlite_retention_days: 7           # Keep 7 days in SQLite
  sqlite_path: "data/plant_data.db"
